# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 10000

set -g base-index 1
set -g pane-base-index 1

unbind C-b
set -g prefix C-s
bind C-s send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Open new window in current path
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle zoom
bind -r m resize-pane -Z

unbind v
bind v copy-mode

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Switch windows
bind C-h previous-window
bind C-l next-window

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

bind-key g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit
bind-key i display-popup -d '#{pane_current_path}' -w80% -h80% -E calcurse 
bind-key a display-popup -d '#{pane_current_path}' -w80% -h80% -E opencode
bind-key o display-popup -d '#{pane_current_path}' -w80% -h80% -E nnn
bind-key o display-popup -d '#{pane_current_path}' -w80% -h80% -E nnn

